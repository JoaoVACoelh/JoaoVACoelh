<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">pos-nfce: frente de caixa desktop com emissão de NFC-e</title>
<desc id="d">Módulos Catálogo, Caixa, Fiscal e Relatórios em volta do Shared Kernel, cada um com camadas de domínio, aplicação e adaptadores.</desc>
<style>text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }</style>
<rect x="1" y="1" width="1198" height="398" rx="16" fill="none" stroke="#D0D7DE" stroke-width="2"/>
<text x="48" y="90" font-size="46" font-weight="700" letter-spacing="-.8" fill="#1D2733">pos-nfce</text>
<text x="50" y="130" font-size="23" fill="#566273">Frente de caixa desktop com emissão de NFC-e</text>
<text x="50" y="184" font-size="20" fill="#1D2733">Monólito modular em .NET 10 com arquitetura</text><text x="50" y="213" font-size="20" fill="#1D2733">hexagonal: cada módulo separa domínio, aplicação</text><text x="50" y="242" font-size="20" fill="#1D2733">e adaptadores, e testes de arquitetura garantem</text><text x="50" y="271" font-size="20" fill="#1D2733">que as dependências respeitem essas camadas.</text>
<text x="50" y="312" font-size="19" font-weight="600" fill="#1D2733">.NET 10, C#, WPF, EF Core, SQLite, xUnit</text>
<path d="M69,347 L64,356 L54,356 L49,347 L54,338 L64,338 Z" fill="#E2C27F"/><text x="76" y="353" font-size="17" fill="#566273">Domínio</text><path d="M192,347 L186,356 L176,356 L172,347 L176,338 L186,338 Z" fill="#E3E9EE" stroke="#B8C2CD" stroke-width="1.5"/><text x="198.5" y="353" font-size="17" fill="#566273">Aplicação</text><path d="M333,347 L328,356 L318,356 L313,347 L318,338 L328,338 Z" fill="#8E9FB6"/><text x="340.0" y="353" font-size="17" fill="#566273">Adaptadores</text>
<path d="M1000,202 L961,270 L883,270 L844,202 L883,134 L961,134 Z" fill="#F3F5F7" stroke="#B8C2CD" stroke-width="2"/><text x="922" y="208" font-size="17" font-weight="600" text-anchor="middle" fill="#566273">Shared Kernel</text><path d="M883,134 L844,202 L766,202 L727,134 L766,67 L844,67 Z" fill="#8E9FB6" stroke="#FFFFFF" stroke-width="3"/><path d="M858,134 L832,180 L778,180 L752,134 L778,89 L832,89 Z" fill="#E3E9EE"/><path d="M833,134 L819,159 L791,159 L777,134 L791,110 L819,110 Z" fill="#E2C27F"/><text x="805" y="53" font-size="19" font-weight="600" text-anchor="middle" fill="#1D2733">Catálogo</text><path d="M1117,134 L1078,202 L1000,202 L961,134 L1000,67 L1078,67 Z" fill="#8E9FB6" stroke="#FFFFFF" stroke-width="3"/><path d="M1092,134 L1066,180 L1012,180 L986,134 L1012,89 L1066,89 Z" fill="#E3E9EE"/><path d="M1067,134 L1053,159 L1025,159 L1011,134 L1025,110 L1053,110 Z" fill="#E2C27F"/><text x="1039" y="53" font-size="19" font-weight="600" text-anchor="middle" fill="#1D2733">Caixa</text><path d="M883,270 L844,337 L766,337 L727,270 L766,202 L844,202 Z" fill="#8E9FB6" stroke="#FFFFFF" stroke-width="3"/><path d="M858,270 L832,315 L778,315 L752,270 L778,224 L832,224 Z" fill="#E3E9EE"/><path d="M833,270 L819,294 L791,294 L777,270 L791,245 L819,245 Z" fill="#E2C27F"/><text x="805" y="367" font-size="19" font-weight="600" text-anchor="middle" fill="#1D2733">Fiscal</text><path d="M1117,270 L1078,337 L1000,337 L961,270 L1000,202 L1078,202 Z" fill="#8E9FB6" stroke="#FFFFFF" stroke-width="3"/><path d="M1092,270 L1066,315 L1012,315 L986,270 L1012,224 L1066,224 Z" fill="#E3E9EE"/><path d="M1067,270 L1053,294 L1025,294 L1011,270 L1025,245 L1053,245 Z" fill="#E2C27F"/><text x="1039" y="367" font-size="19" font-weight="600" text-anchor="middle" fill="#1D2733">Relatórios</text>
